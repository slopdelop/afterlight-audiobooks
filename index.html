<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c131d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Afterlight"><meta name="description" content="A personal audiobook library. Listen, unwind, and pick up where you left off."><title>Afterlight · Audiobooks</title><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<a class="skip-link" href="#main">Skip to content</a><div class="app-shell"><header class="app-header"><a href="#library" class="brand" aria-label="Afterlight library"><span class="brand-icon">◒</span> afterlight<span class="version">MVP 1</span></a><button id="settingsButton" class="icon-button" aria-label="Settings"><span data-icon="settings"></span></button></header>
<main id="main"><section id="libraryView"><div class="eyebrow">A LITTLE SPACE TO LISTEN</div><div class="page-heading"><h1>Your next<br>good chapter<span>.</span></h1><button id="importButton" class="subtle-button"><span data-icon="plus"></span> Add MP3</button></div><p class="intro">Settle in. Your place is right here.</p><div id="continueCard"></div><div class="section-title"><h2>Your library</h2><span id="bookCount"></span></div><label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Find a book" aria-label="Search books"></label><div id="libraryGrid" class="library-grid"></div><p id="libraryEmpty" hidden>No books match your search.</p><div class="quiet-note"><span data-icon="headphones"></span><p>Made for the unhurried hours.<br><span>Your listening progress stays on this device.</span></p></div></section>
<section id="playerView" hidden><button class="back-button" id="backLibrary"><span data-icon="chevronLeft"></span> Library</button><div class="player-layout"><div class="cover-wrap"><img id="playerCover" alt="Book cover" class="player-cover"><span class="cover-caption">YOUR PERSONAL AUDIO EDITION</span></div><div class="player-content"><p class="eyebrow" id="playerSeries"></p><h1 id="playerTitle"></h1><p class="narrator" id="playerNarrator"></p><button id="chapterButton" class="chapter-title"><span id="playerChapter"></span><span data-icon="list"></span></button><div class="progress-section"><label class="sr-only" for="seek">Playback position</label><input id="seek" class="seek" type="range" min="0" max="100" value="0" step="0.1"><div class="time-labels"><span id="elapsed">0:00</span><button id="remainingButton" aria-label="Toggle remaining time display">−19:51</button></div></div><div class="transport"><button id="previousChapter" class="icon-button small-transport" aria-label="Previous chapter"><span data-icon="previous"></span></button><button id="back15" class="skip-button" aria-label="Rewind 15 seconds"><span data-icon="rewind"></span><span>15</span></button><button id="playButton" class="play-button" aria-label="Play"><span data-icon="play"></span></button><button id="forward30" class="skip-button" aria-label="Forward 30 seconds"><span data-icon="forward"></span><span>30</span></button><button id="nextChapter" class="icon-button small-transport" aria-label="Next chapter"><span data-icon="next"></span></button></div><p id="playbackStatus" class="playback-status" role="status">Ready when you are</p><div class="player-tools"><button id="speedButton"><span class="tool-value" id="speedValue">1×</span><span>Speed</span></button><button id="sleepButton"><span data-icon="moon"></span><span id="sleepValue">Sleep timer</span></button><button id="bookmarkButton"><span data-icon="bookmark"></span><span>Bookmark</span></button><button id="downloadButton"><span data-icon="download"></span><span id="downloadValue">Download</span></button></div><div class="book-bottom"><span id="chapterProgress"></span><button id="bookmarksButton" class="text-button">View bookmarks <span data-icon="arrowRight"></span></button></div><p class="book-note" id="bookNote"></p></div></div></section></main>
<div id="miniPlayer" class="mini-player" hidden><button id="miniOpen" class="mini-open"><img id="miniCover" alt=""><span><strong id="miniTitle"></strong><small id="miniChapter"></small></span></button><button id="miniPlay" class="icon-button" aria-label="Play"><span data-icon="play"></span></button><div id="miniProgress"></div></div><nav class="bottom-nav" aria-label="Main navigation"><button id="navLibrary" aria-current="page"><span data-icon="library"></span><span>Library</span></button><button id="navPlayer"><span data-icon="headphones"></span><span>Now playing</span></button><button id="navBookmarks"><span data-icon="bookmark"></span><span>Bookmarks</span></button></nav></div>
<audio id="audio" preload="metadata" playsinline></audio><dialog id="panel"><div class="dialog-head"><h2 id="panelTitle"></h2><button id="closePanel" class="icon-button" aria-label="Close"><span data-icon="close"></span></button></div><div id="panelBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
